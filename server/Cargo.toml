[package]
name = "bugbounty-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "fs"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Markdown rendering
pulldown-cmark = "0.13"

# Full-text search
tantivy = "0.26"

# File watching for hot-reload
notify = "7"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
walkdir = "2"
chrono = "0.4"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
regex = "1"
toml = "0.8"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

# Dense embeddings for hybrid RAG retrieval
fastembed = { version = "5.17.4", default-features = false, features = ["hf-hub-native-tls", "ort-download-binaries"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
